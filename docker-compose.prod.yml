version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./packages/backend
      target: prod
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      RP_NAME: ${RP_NAME}
      RP_ID: ${RP_ID}
      ORIGIN: ${ORIGIN}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-}
      DEFAULT_LLM_API_KEY: ${DEFAULT_LLM_API_KEY:-}
      DEFAULT_FACILITATOR_MODEL: ${DEFAULT_FACILITATOR_MODEL:-}
      DEFAULT_DEBATER_A_MODEL: ${DEFAULT_DEBATER_A_MODEL:-}
      DEFAULT_DEBATER_B_MODEL: ${DEFAULT_DEBATER_B_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-13001}:3001"
    restart: unless-stopped

  frontend:
    build:
      context: ./packages/frontend
      target: prod
      args:
        VITE_API_URL: ${ORIGIN}
        VITE_WS_URL: ${WS_ORIGIN}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-18080}:3000"
    restart: unless-stopped

volumes:
  postgres_data:
